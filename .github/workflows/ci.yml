name: KAYRO AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kayro-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate browser extension
        run: |
          node --check browser-extension/popup.js
          node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('browser-extension/manifest.json','utf8')); if(m.manifest_version!==3 || !fs.existsSync('browser-extension/popup.html')) process.exit(1); console.log('Manifest V3 and popup files are valid.')"

      - name: Validate SQL migrations
        run: |
          python - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(':memory:')
          for path in sorted(pathlib.Path('migrations').glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'projects', 'workspace_tasks', 'memories', 'activity_log'}
          missing = required - tables
          if missing:
              raise SystemExit(f'Missing workspace tables: {sorted(missing)}')
          print('All migration SQL executed successfully.')
          PY

      - name: Validate Telegram bridge syntax
        run: python -m py_compile telegram-user-service/main.py

      - name: Build production frontend
        run: npm run build

      - name: Bundle Worker and static assets for direct deployment
        run: |
          mkdir -p deployment
          cp -R dist/. deployment/
          npx tsc -p tsconfig.worker.json --noEmit false --rootDir worker --outDir deployment
          mv deployment/index.js deployment/_worker.js
          test -s deployment/index.html
          test -s deployment/_worker.js

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: kayro-ai-deploy-${{ github.sha }}
          path: deployment/
          if-no-files-found: error
          retention-days: 3
