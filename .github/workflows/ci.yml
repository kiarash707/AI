name: KAYRO AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kayro-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Bundle Worker and static assets for direct deployment
        run: |
          mkdir -p deployment
          cp -R dist/. deployment/
          npx tsc -p tsconfig.worker.json --noEmit false --rootDir worker --outDir deployment
          mv deployment/index.js deployment/worker.js
          test -s deployment/index.html
          test -s deployment/worker.js

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: kayro-ai-deploy-${{ github.sha }}
          path: deployment/
          if-no-files-found: error
          retention-days: 3
