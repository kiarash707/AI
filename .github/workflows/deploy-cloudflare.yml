name: Deploy KAYRO AI to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kayro-ai-pages-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check required secrets without exposing their values
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deployment not run"
              echo "The code checks still run, but automatic deployment is waiting for the two repository secrets:"
              echo "- `CLOUDFLARE_API_TOKEN` (Cloudflare token with Pages Edit for this account)"
              echo "- `CLOUDFLARE_ACCOUNT_ID` (the Cloudflare account ID)"
              echo "Add them under GitHub → Settings → Secrets and variables → Actions. This is a deployment credential only; the public website will not require login."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cloudflare Pages deployment skipped: repository deployment secrets are not configured."
          fi

  deploy:
    name: Build, deploy Pages, and smoke-test
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check frontend, Worker, and Pages Functions types
        run: npm run check

      - name: Run unit and regression tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Deploy the Pages project and its Functions
        run: npx --yes wrangler@4 pages deploy dist --project-name kayro-ai --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"

      - name: Verify public site, API, and anonymous chat session
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://kayro-ai.pages.dev"
          HEALTH_OK=false
          for attempt in {1..10}; do
            status=$(curl -sS --max-time 10 -o /tmp/kayro-health.json -w '%{http_code}' "$BASE_URL/api/health" || true)
            if [[ "$status" == "200" ]] && node -e "const d=require('/tmp/kayro-health.json');process.exit(d.ok===true&&d.database==='ok'?0:1)"; then
              HEALTH_OK=true
              break
            fi
            sleep 3
          done
          if [[ "$HEALTH_OK" != "true" ]]; then
            echo "::error::Cloudflare Pages deployed, but the health endpoint did not confirm the D1 binding."
            cat /tmp/kayro-health.json 2>/dev/null || true
            exit 1
          fi
          chat_status=$(curl -sS --max-time 10 -c /tmp/kayro-cookies.txt -b /tmp/kayro-cookies.txt -o /tmp/kayro-chats.json -w '%{http_code}' "$BASE_URL/api/conversations")
          if [[ "$chat_status" != "200" ]] || ! node -e "const d=require('/tmp/kayro-chats.json');process.exit(Array.isArray(d)?0:1)"; then
            echo "::error::The public anonymous-conversation API check failed."
            cat /tmp/kayro-chats.json 2>/dev/null || true
            exit 1
          fi
          {
            echo "### Deployment succeeded"
            echo "- Site: $BASE_URL"
            echo "- Health: $BASE_URL/api/health (Worker + D1 confirmed)"
            echo "- Public chat API: passed without an account or login; a private browser-scoped session cookie was issued."
            echo "- Owner settings remain protected by Cloudflare Access on the settings API paths only."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "KAYRO AI deployed and smoke-tested: $BASE_URL"
